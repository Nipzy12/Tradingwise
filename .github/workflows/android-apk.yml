name: Tradingwise Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/android-apk]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
      - name: Build and lint
        working-directory: android
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Verify signed APK and checksum
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Tradingwise-v0.1.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/Tradingwise-v0.1.0-debug.apk
          (cd output && sha256sum Tradingwise-v0.1.0-debug.apk > SHA256SUMS.txt)
          ls -lh output
          cat output/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tradingwise-Android-APK
          path: output/
          if-no-files-found: error
          retention-days: 90
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tradingwise-Android-APK
          path: output
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-v0.1.0-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" output/* --clobber
          else
            gh release create "$tag" output/* --target "$GITHUB_SHA" --prerelease --title "Tradingwise Android 0.1.0 (build $GITHUB_RUN_NUMBER)" --notes "Installable debug preview; opens Tradingwise online. Binance and Biquote use existing market gateways. Internet required. Not Play Store signed."
          fi
