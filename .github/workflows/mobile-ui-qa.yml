name: Tradingwise Mobile UI QA
on:
  pull_request:
    branches: [main]
    paths: ['index.html', 'src/**', 'scripts/mobile-smoke.mjs', '.github/workflows/mobile-ui-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1 lightweight-charts@5.0.8
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-static.mjs
      - run: node scripts/mobile-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tradingwise-mobile-screenshots
          path: mobile-qa/
          if-no-files-found: warn
