name: Tradingwise CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integration tests
        run: npm test
      - name: Build static frontend
        run: node scripts/build-static.mjs
      - name: Verify static assets
        run: test -f dist/index.html && test -f dist/src/market.js && test -f dist/src/binance-direct.js
